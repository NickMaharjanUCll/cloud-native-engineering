# Use root/example as user/password credentials
version: '3.1'

services:
  backend:
    restart: always
    build: ./back-end
    ports:
      - 3000:3000

  functionapp:
    restart: always
    build: ./function-app
    ports:
      - 3001:3001

  frontend:
    build: ./front-end
    ports:
      - 8080:8080